name: Stand-up Comedian AW

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl Tokyo Comedy Bar
        run: python scripts/crawl_tcb.py --output data/tcb-candidates.jsonl
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tcb-candidates.jsonl
          git diff --cached --quiet || git commit -m "aw: refresh Tokyo Comedy Bar candidates"
          git push
